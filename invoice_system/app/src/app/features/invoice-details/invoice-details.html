<app-header/>
<div class="container mt-5">
    <h3>Invoice Details</h3>

    <div class="card mt-4">
        <div class="card-body">
            <h5>Invoice #INV-1001</h5>
            <p><strong>Customer:</strong> ABC Ltd</p>
            <p><strong>Date:</strong> 2024-06-01</p>
            <p><strong>Status:</strong> <span class="badge bg-warning">Pending</span></p>

            <hr>

            <h6>Items</h6>
            <table class="table">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Product A</td>
                        <td>2</td>
                        <td>$100</td>
                        <td>$200</td>
                    </tr>

                    <tr>
                        <td>Product B</td>
                        <td>3</td>
                        <td>$150</td>
                        <td>$450</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">Total:</th>
                        <th>$650.00</th>
                    </tr>
                </tfoot>

            </table>

            <button class="btn btn-success" (click)="payNow()">Pay Now</button>

        </div>
    </div>
</div>

<app-footer/>
