<app-header />
<div class="container mt-5">
<div class="d-flex justify-content-between mb-3">
  <h3>Customers</h3>
  <button routerLink="/add-customer" class="btn btn-primary">+ Add Customer</button>
</div>

<input class="form-control mb-3" placeholder="Search customer...">

<div class="card">
  <div class="card-body">

    <table class="table table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>John Doe</td>
          <td>john@email.com</td>
          <td>0123456789</td>
          <td>
            <button class="btn btn-sm btn-warning">Edit</button>
            <button class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>
</div>
<app-footer/>
